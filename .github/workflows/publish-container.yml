name: Publish Linux Bridge Container

# Publiserer container-imaget til GitHub Container Registry.
#
# Pakker publisert fra en workflow med GITHUB_TOKEN arver repoets
# synlighet, og blir dermed offentlige. Pakker publisert utenfra med
# et personlig token blir alltid private, og GitHub har ingen API for
# aa endre synlighet etterpå.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versjon som tagges (f.eks. 1.0.0). Tom = bare latest.'
        required: false
        default: ''
  push:
    tags:
      - 'linux-bridge-*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Installer Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      # GHCR krever lowercase i pakkenavnet, mens repoet kan ha stor O.
      # Derfor settes GHCR_IMAGE i et tidligere steg, slik at det brukes
      # som en vanlig miljøvariabel (ikke interpolert i YAML).
      - name: Sett image-navn
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/omp-bridge" >> "$GITHUB_ENV"
          echo "Image: $GHCR_IMAGE"

      - name: Bygg image
        working-directory: linux-bridge
        run: |
          podman build \
            --tag "${GHCR_IMAGE}:latest" \
            --file Containerfile \
            .

      - name: Publiser image
        env:
          REGISTRY: ghcr.io
        run: |
          # podman login --password-stdin feiler i Actions-miljoet
          # ("inappropriate ioctl for device"), saa --creds brukes
          # direkte pa push i stedet.
          CREDS="${GITHUB_ACTOR}:${GITHUB_TOKEN}"

          podman push --creds "${CREDS}" "${GHCR_IMAGE}:latest"

          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/linux-bridge-}"
          fi
          if [ -n "$VERSION" ]; then
            podman tag "${GHCR_IMAGE}:latest" "${GHCR_IMAGE}:${VERSION}"
            podman push --creds "${CREDS}" "${GHCR_IMAGE}:${VERSION}"
          fi
